<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Stars ⭐</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #5bcefa;
    --sun: #FFD93D;
    --grass: #6BCB77;
    --coral: #FF6B6B;
    --purple: #845EC2;
    --white: #FFFDF7;
    --ink: #2d2d2d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--sky);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* Floating clouds background */
  .cloud {
    position: fixed;
    background: white;
    border-radius: 50px;
    opacity: 0.6;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud:nth-child(1) { width: 120px; height: 40px; top: 10%; left: -130px; animation-duration: 25s; }
  .cloud:nth-child(1)::before { width: 60px; height: 60px; top: -30px; left: 20px; }
  .cloud:nth-child(1)::after  { width: 40px; height: 40px; top: -18px; left: 55px; }
  .cloud:nth-child(2) { width: 80px; height: 28px; top: 30%; left: -90px; animation-duration: 35s; animation-delay: -10s; }
  .cloud:nth-child(2)::before { width: 40px; height: 40px; top: -20px; left: 12px; }
  .cloud:nth-child(2)::after  { width: 28px; height: 28px; top: -12px; left: 38px; }
  .cloud:nth-child(3) { width: 100px; height: 35px; top: 65%; left: -110px; animation-duration: 30s; animation-delay: -5s; }
  .cloud:nth-child(3)::before { width: 50px; height: 50px; top: -25px; left: 15px; }
  .cloud:nth-child(3)::after  { width: 35px; height: 35px; top: -15px; left: 48px; }

  @keyframes drift { from { left: -150px; } to { left: 110%; } }

  /* Stars */
  .star {
    position: fixed;
    font-size: 1.5rem;
    animation: twinkle 2s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes twinkle { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.1); } }

  /* Main card */
  .card {
    background: var(--white);
    border-radius: 32px;
    padding: 40px 36px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 12px 0 #e8b94a, 0 16px 40px rgba(0,0,0,0.15);
    position: relative;
    z-index: 10;
  }

  .title {
    font-family: 'Fredoka One', cursive;
    font-size: 2.6rem;
    color: var(--purple);
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 28px;
  }

  /* Word list editor */
  .section-label {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .word-list-area {
    background: #f5f0ff;
    border: 2.5px dashed #c5aff5;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 24px;
  }

  .word-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
    min-height: 36px;
  }

  .word-tag {
    background: var(--purple);
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    padding: 4px 12px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: default;
  }
  .word-tag .remove-btn {
    background: rgba(255,255,255,0.3);
    border: none;
    color: white;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 0.7rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .word-tag .remove-btn:hover { background: rgba(255,255,255,0.5); }

  .add-word-row {
    display: flex;
    gap: 8px;
  }
  .add-word-row input {
    flex: 1;
    border: 2px solid #c5aff5;
    border-radius: 10px;
    padding: 7px 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    outline: none;
    background: white;
    transition: border-color 0.2s;
  }
  .add-word-row input:focus { border-color: var(--purple); }
  .add-word-btn {
    background: var(--purple);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 7px 16px;
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .add-word-btn:hover { background: #6e4aaa; transform: scale(1.05); }

  /* Game area */
  .game-area { text-align: center; }

  .progress-bar-wrap {
    background: #eee;
    border-radius: 10px;
    height: 12px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, var(--grass), #4fc870);
    height: 100%;
    border-radius: 10px;
    transition: width 0.4s ease;
  }

  .word-number {
    font-size: 0.9rem;
    font-weight: 700;
    color: #aaa;
    margin-bottom: 6px;
  }

  .speak-btn {
    background: var(--sun);
    border: none;
    border-radius: 24px;
    padding: 18px 40px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.6rem;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 6px 0 #d4a800;
    transition: transform 0.1s, box-shadow 0.1s;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    animation: wiggle 3s ease-in-out infinite;
  }
  .speak-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #d4a800; }
  .speak-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d4a800; }
  .speak-btn.speaking { animation: none; background: #ffeb8a; }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    92% { transform: rotate(0deg); }
    94% { transform: rotate(-3deg); }
    96% { transform: rotate(3deg); }
    98% { transform: rotate(-2deg); }
  }

  .hint-text {
    font-size: 0.9rem;
    color: #aaa;
    margin-bottom: 20px;
    font-weight: 600;
  }

  .answer-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .answer-input {
    border: 3px solid #ddd;
    border-radius: 16px;
    padding: 14px 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    width: 220px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    color: var(--ink);
  }
  .answer-input:focus { border-color: var(--purple); box-shadow: 0 0 0 4px rgba(132,94,194,0.15); }
  .answer-input.correct { border-color: var(--grass); background: #f0fff3; }
  .answer-input.wrong { border-color: var(--coral); background: #fff5f5; animation: shake 0.4s ease; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .check-btn {
    background: var(--grass);
    border: none;
    border-radius: 16px;
    padding: 14px 24px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 #43a057;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .check-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #43a057; }
  .check-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #43a057; }
  .check-btn:disabled { background: #ccc; box-shadow: 0 5px 0 #aaa; cursor: not-allowed; }

  /* Feedback */
  .feedback {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    min-height: 2rem;
    transition: all 0.3s;
  }
  .feedback.correct { color: var(--grass); }
  .feedback.wrong { color: var(--coral); }

  .next-btn {
    background: var(--purple);
    border: none;
    border-radius: 16px;
    padding: 12px 32px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 #5c3a9e;
    margin-top: 14px;
    transition: transform 0.1s, box-shadow 0.1s;
    display: none;
  }
  .next-btn.visible { display: inline-block; }
  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #5c3a9e; }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #5c3a9e; }

  /* Score panel */
  .score-wrap {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 2px dashed #eee;
  }
  .score-box {
    text-align: center;
  }
  .score-num {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
  }
  .score-num.green { color: var(--grass); }
  .score-num.red { color: var(--coral); }
  .score-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: #bbb;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Results screen */
  .results {
    text-align: center;
    display: none;
  }
  .results.visible { display: block; }
  .results-emoji { font-size: 4rem; margin-bottom: 10px; }
  .results-title {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    color: var(--purple);
    margin-bottom: 8px;
  }
  .results-score {
    font-size: 1.1rem;
    font-weight: 700;
    color: #666;
    margin-bottom: 24px;
  }
  .results-list {
    text-align: left;
    background: #f9f6ff;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .results-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 1rem;
    font-weight: 700;
    border-bottom: 1px dashed #e5ddf5;
  }
  .results-list-item:last-child { border-bottom: none; }
  .play-again-btn {
    background: var(--sun);
    border: none;
    border-radius: 20px;
    padding: 16px 48px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 6px 0 #d4a800;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .play-again-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #d4a800; }
  .play-again-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d4a800; }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    animation: confetti-fall linear forwards;
    border-radius: 2px;
    pointer-events: none;
    z-index: 999;
  }
  @keyframes confetti-fall {
    to { top: 110vh; transform: rotate(720deg) translateX(100px); }
  }

  /* Setup vs Game views */
  #setup-view {}
  #game-view { display: none; }
  #game-view.active { display: block; }

  .start-btn {
    width: 100%;
    background: var(--coral);
    border: none;
    border-radius: 20px;
    padding: 18px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    color: white;
    cursor: pointer;
    box-shadow: 0 7px 0 #c94848;
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 1px;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 9px 0 #c94848; }
  .start-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #c94848; }
  .start-btn:disabled { background: #ccc; box-shadow: 0 7px 0 #aaa; cursor: not-allowed; }

  .empty-notice {
    text-align: center;
    color: #bbb;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 8px;
  }
</style>
</head>
<body>

<!-- Background decorations -->
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="star" style="top:8%;left:5%;animation-delay:0s">⭐</div>
<div class="star" style="top:15%;right:8%;animation-delay:0.7s">🌟</div>
<div class="star" style="top:80%;left:7%;animation-delay:1.2s">⭐</div>
<div class="star" style="top:75%;right:6%;animation-delay:0.4s">🌟</div>

<div class="card">
  <div class="title">🌈 Spelling Stars</div>
  <p class="subtitle">Listen carefully and spell it right!</p>

  <!-- SETUP VIEW -->
  <div id="setup-view">
    <div class="section-label">📝 Your Word List</div>
    <div class="word-list-area">
      <div class="word-tags" id="word-tags"></div>
      <div class="add-word-row">
        <input type="text" id="new-word-input" placeholder="Type a word…" maxlength="30" />
        <button class="add-word-btn" onclick="addWord()">+ Add</button>
      </div>
    </div>
    <button class="start-btn" id="start-btn" onclick="startGame()">🚀 Start Spelling!</button>
  </div>

  <!-- GAME VIEW -->
  <div id="game-view">

    <!-- Active game -->
    <div id="active-game">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="word-number" id="word-number">Word 1 of 5</div>

      <div class="game-area">
        <button class="speak-btn" id="speak-btn" onclick="speakWord()">
          🔊 Hear the Word
        </button>
        <p class="hint-text">Press the button, then type what you hear!</p>

        <div class="answer-row">
          <input class="answer-input" id="answer-input"
                 type="text" placeholder="Spell it…"
                 onkeydown="if(event.key==='Enter') checkAnswer()"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          <button class="check-btn" id="check-btn" onclick="checkAnswer()">✓</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextWord()">Next Word →</button>
      </div>

      <div class="score-wrap">
        <div class="score-box">
          <div class="score-num green" id="correct-count">0</div>
          <div class="score-label">✅ Correct</div>
        </div>
        <div class="score-box">
          <div class="score-num red" id="wrong-count">0</div>
          <div class="score-label">❌ Wrong</div>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div class="results" id="results">
      <div class="results-emoji" id="results-emoji">🎉</div>
      <div class="results-title" id="results-title">Great job!</div>
      <div class="results-score" id="results-score"></div>
      <div class="results-list" id="results-list"></div>
      <button class="play-again-btn" onclick="playAgain()">🔄 Play Again</button>
    </div>

  </div>
</div>

<script>
  // ── Sound effects via Web Audio API (resumed on first user click) ──
  let _actx = null;
  function actx() {
    if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === 'suspended') _actx.resume();
    return _actx;
  }

  function beep(frequency, type, duration, volume, delay) {
    const ctx = actx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.value = frequency;
    const t0 = ctx.currentTime + (delay || 0);
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.start(t0);
    osc.stop(t0 + duration);
  }

  function playCorrectSound() {
    // Bright ascending chime: C5 → E5 → G5
    beep(523, 'sine', 0.25, 0.4, 0.00);
    beep(659, 'sine', 0.25, 0.4, 0.15);
    beep(784, 'sine', 0.35, 0.4, 0.30);
  }

  function playWrongSound() {
    // Low descending thud
    beep(330, 'sawtooth', 0.18, 0.3, 0.00);
    beep(220, 'sawtooth', 0.25, 0.3, 0.18);
  }

  // Unlock AudioContext on the very first interaction with the page
  document.addEventListener('click', () => actx(), { once: true });
  // ──────────────────────────────────────────────────────────────────

  // Default word list
  let wordList = ['apple', 'happy', 'friend', 'school', 'pretty', 'funny', 'night', 'light'];
  let shuffled = [];
  let currentIndex = 0;
  let correctCount = 0;
  let wrongCount = 0;
  let answered = false;
  let resultLog = [];
  let hasSpoken = false;

  function renderTags() {
    const container = document.getElementById('word-tags');
    if (wordList.length === 0) {
      container.innerHTML = '<div class="empty-notice">No words yet — add some above!</div>';
    } else {
      container.innerHTML = wordList.map((w, i) =>
        `<div class="word-tag">${w}<button class="remove-btn" onclick="removeWord(${i})">✕</button></div>`
      ).join('');
    }
    document.getElementById('start-btn').disabled = wordList.length === 0;
  }

  function addWord() {
    const input = document.getElementById('new-word-input');
    const val = input.value.trim().toLowerCase().replace(/[^a-z'-]/g, '');
    if (!val) return;
    if (wordList.includes(val)) { input.value = ''; return; }
    wordList.push(val);
    input.value = '';
    renderTags();
  }

  function removeWord(i) {
    wordList.splice(i, 1);
    renderTags();
  }

  document.getElementById('new-word-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addWord();
  });

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame() {
    shuffled = shuffle(wordList);
    currentIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    resultLog = [];
    document.getElementById('setup-view').style.display = 'none';
    document.getElementById('game-view').classList.add('active');
    document.getElementById('results').classList.remove('visible');
    document.getElementById('active-game').style.display = 'block';
    loadWord();
  }

  function loadWord() {
    answered = false;
    hasSpoken = false;
    const total = shuffled.length;
    const num = currentIndex + 1;

    document.getElementById('word-number').textContent = `Word ${num} of ${total}`;
    document.getElementById('progress-bar').style.width = ((currentIndex / total) * 100) + '%';

    const input = document.getElementById('answer-input');
    input.value = '';
    input.className = 'answer-input';
    input.disabled = false;

    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('next-btn').classList.remove('visible');
    document.getElementById('check-btn').disabled = false;

    const speakBtn = document.getElementById('speak-btn');
    speakBtn.classList.remove('speaking');

    // Focus input after a moment
    setTimeout(() => input.focus(), 100);
  }

  function speakWord() {
    if (!window.speechSynthesis) {
      alert("Sorry, your browser doesn't support text-to-speech!");
      return;
    }
    const word = shuffled[currentIndex];
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word);
    utter.rate = 0.5;
    utter.pitch = 1.1;

    const btn = document.getElementById('speak-btn');
    btn.classList.add('speaking');
    utter.onend = () => btn.classList.remove('speaking');

    window.speechSynthesis.speak(utter);
    hasSpoken = true;
  }

  function checkAnswer() {
    if (answered) return;
    if (!hasSpoken) {
      // Gentle nudge to hear word first
      const fb = document.getElementById('feedback');
      fb.textContent = '👂 Press the yellow button to hear the word first!';
      fb.className = 'feedback';
      fb.style.color = '#f0a500';
      return;
    }

    const input = document.getElementById('answer-input');
    const userAnswer = input.value.trim().toLowerCase();
    const correct = shuffled[currentIndex];

    if (!userAnswer) { input.focus(); return; }

    answered = true;
    document.getElementById('check-btn').disabled = true;
    input.disabled = true;

    const fb = document.getElementById('feedback');

    if (userAnswer === correct) {
      correctCount++;
      input.classList.add('correct');
      fb.textContent = ['⭐ Amazing!', '🎉 You got it!', '🌟 Perfect!', '🏆 Superstar!', '✅ Excellent!'][Math.floor(Math.random()*5)];
      fb.className = 'feedback correct';
      resultLog.push({ word: correct, got: true });
      playCorrectSound();
      launchConfetti(8);
    } else {
      wrongCount++;
      input.classList.add('wrong');
      fb.innerHTML = `❌ Not quite! It's <strong>${correct}</strong>`;
      fb.className = 'feedback wrong';
      resultLog.push({ word: correct, got: false, tried: userAnswer });
      playWrongSound();
    }

    document.getElementById('correct-count').textContent = correctCount;
    document.getElementById('wrong-count').textContent = wrongCount;

    // Update progress
    document.getElementById('progress-bar').style.width = (((currentIndex + 1) / shuffled.length) * 100) + '%';

    if (currentIndex < shuffled.length - 1) {
      document.getElementById('next-btn').classList.add('visible');
    } else {
      setTimeout(showResults, 1200);
    }
  }

  function nextWord() {
    currentIndex++;
    loadWord();
  }

  function showResults() {
    document.getElementById('active-game').style.display = 'none';
    const results = document.getElementById('results');
    results.classList.add('visible');

    const total = shuffled.length;
    const pct = Math.round((correctCount / total) * 100);

    let emoji = pct === 100 ? '🏆' : pct >= 80 ? '🌟' : pct >= 60 ? '😊' : '💪';
    let title = pct === 100 ? 'Perfect Score!' : pct >= 80 ? 'Great Job!' : pct >= 60 ? 'Good Work!' : 'Keep Practicing!';

    document.getElementById('results-emoji').textContent = emoji;
    document.getElementById('results-title').textContent = title;
    document.getElementById('results-score').textContent = `${correctCount} out of ${total} correct (${pct}%)`;

    const list = document.getElementById('results-list');
    list.innerHTML = resultLog.map(r =>
      r.got
        ? `<div class="results-list-item"><span>✅</span><span>${r.word}</span></div>`
        : `<div class="results-list-item"><span>❌</span><span>${r.word}</span><span style="color:#aaa;font-weight:400;font-size:0.85rem">(you wrote: ${r.tried})</span></div>`
    ).join('');

    if (pct === 100) launchConfetti(30);
  }

  function playAgain() {
    document.getElementById('results').classList.remove('visible');
    document.getElementById('active-game').style.display = 'block';
    document.getElementById('correct-count').textContent = '0';
    document.getElementById('wrong-count').textContent = '0';
    startGame();
  }

  function launchConfetti(count) {
    const colors = ['#FFD93D','#6BCB77','#FF6B6B','#845EC2','#5bcefa','#ff9f43'];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay = Math.random() * 0.5 + 's';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }

  // Init
  renderTags();

  // Embedded favicon / home-screen icon (purple rounded square + gold star)
  window.addEventListener('load', function () {
    try {
      var S = 512;
      var c = document.createElement('canvas');
      c.width = S; c.height = S;
      var g = c.getContext('2d');

      // Rounded square with vertical gradient
      var r = 110;
      g.beginPath();
      g.moveTo(r, 0); g.lineTo(S - r, 0); g.quadraticCurveTo(S, 0, S, r);
      g.lineTo(S, S - r); g.quadraticCurveTo(S, S, S - r, S);
      g.lineTo(r, S); g.quadraticCurveTo(0, S, 0, S - r);
      g.lineTo(0, r); g.quadraticCurveTo(0, 0, r, 0);
      g.closePath();
      var grad = g.createLinearGradient(0, 0, 0, S);
      grad.addColorStop(0, '#966ed7');
      grad.addColorStop(1, '#643ea0');
      g.fillStyle = grad;
      g.fill();

      // Soft highlight
      g.save();
      g.clip();
      var hl = g.createRadialGradient(S / 2, 0, 20, S / 2, 0, S * 0.7);
      hl.addColorStop(0, 'rgba(255,255,255,0.25)');
      hl.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = hl;
      g.fillRect(0, 0, S, S);
      g.restore();

      // Star path
      function star(cx, cy, R, rr) {
        g.beginPath();
        for (var i = 0; i < 10; i++) {
          var a = -Math.PI / 2 + i * Math.PI / 5;
          var rad = (i % 2 === 0) ? R : rr;
          var x = cx + rad * Math.cos(a), y = cy + rad * Math.sin(a);
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.closePath();
      }
      star(S / 2, S / 2 + 16, 170, 72);
      g.fillStyle = 'rgba(60,30,110,0.47)';
      g.fill();
      star(S / 2, S / 2 + 6, 170, 72);
      g.fillStyle = '#FFD93D';
      g.fill();
      g.lineWidth = 4;
      g.strokeStyle = '#E6B414';
      g.stroke();

      var url = c.toDataURL('image/png');
      var icon = document.createElement('link');
      icon.rel = 'icon'; icon.type = 'image/png'; icon.href = url;
      document.head.appendChild(icon);
      var touch = document.createElement('link');
      touch.rel = 'apple-touch-icon'; touch.href = url;
      document.head.appendChild(touch);
    } catch (e) { /* icon is cosmetic; ignore failures */ }
  });
</script>
</body>
